name: Refresh OKNO news cache

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/refresh-news-cache.js
      - name: Save refreshed dispatches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infinityfree/htdocs/data/news_cache.json
          git diff --cached --quiet || git commit -m "Refresh news cache"
          git push
