# /etc/nginx/sites-available/empreinte
# Remplace server_name par ton domaine ou IP publique Oracle
# Ex: okno.ton-domaine.fr ou _
server {
    listen 80;
    listen [::]:80;
    server_name _; # <- sera remplacé par setup.sh $1

    # Logs
    access_log /var/log/nginx/empreinte_access.log;
    error_log /var/log/nginx/empreinte_error.log;

    # Proxy vers Node
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # Important pour geolocation IP client
        proxy_set_header CF-Connecting-IP $remote_addr;
    }

    # Cache statique 1h (comme ton Express)
    location ~* \.(css|js|png|jpg|jpeg|webp|svg|ico)$ {
        proxy_pass http://127.0.0.1:3000;
        expires 1h;
        add_header Cache-Control "public";
    }

    # Sécurité headers (en plus de Express)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
}

# HTTPS sera auto-généré par certbot :
# sudo certbot --nginx -d ton-domaine.fr
